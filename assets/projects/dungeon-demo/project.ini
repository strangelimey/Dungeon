; Dungeon Demo — project manifest.

name = Dungeon Demo
; Every level in the game, flat. The DUNGEON tier (catalog/dungeons.cat) groups
; them; this list is the editor's universe and stays whole.
;
; eval_arena is the HARNESS's ground, not content — see its own header. It is
; listed here because the editor and the checker must know about it, and it
; belongs to the `eval` dungeon so the checker has nothing to complain about.
levels = crypt1 crypt2 eval_arena

; WHERE THE GAME BEGINS. A starter dungeon, entered at its own door — the
; game's opening is just another way in, and like every other way in it carries
; its own destination (docs/world-map.md). Remove these four lines and a new
; game begins on the world map instead.
start_dungeon = crypt
start_level = crypt1
start_x = 7
start_z = 7

; Where the eval harness puts the party when it asks for a level rather than
; the world map (Game_Eval.cpp). Named explicitly so the suites do not depend
; on which level happens to be first, and so more harness levels can join.
eval_level = eval_arena

default_sconce = sconce
default_brazier = brazier
